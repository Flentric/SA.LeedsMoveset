[SA.StoriesSprinting]
; Lines beginning with ";" are ignored.
; If a setting can't be read, the default value is used.
; Settings are reloaded automatically while you play, so you can tweak and test live.

; Disables the fat variation of the handgun run walkstyle. 1 = disable. Default 0:
NoFat1Armed=0

; Disables the muscular variation of the handgun run walkstyle. 1 = disable. Default 0:
NoMuscle1Armed=0

; Fire Extinguisher walkstyle fix: makes CJ use the Chainsaw/Flamethrower/Minigun
; walkstyle for the weapons listed under [FireExtWeapons]. 1 = enable. Default 1:
FireExtinguisherWalkstyleFix=1

; AI Weapon Walkstyles: gives PEDS the weapon walkstyles the player gets, so they
; carry a rifle or a rocket launcher properly instead of holding it one-handed.
; Uses the lists under [AIWalkstyles]. 1 = enable. Default 0:
AIWeaponWalkstyles=0

; Stories Sprinting combo: also lets peds use the one-handed jog animation for the
; weapons in [JogWeapons] (and the fire-extinguisher walkstyle for [FireExtWeapons],
; if FireExtinguisherWalkstyleFix=1). Needs AIWeaponWalkstyles=1. Default 0:
AIStoriesSprintingCombo=0

; ============================ How a weapon is chosen ============================
; A weapon gets the jog animation by, in order of priority:
;   1. NoJogWeapons  - listed here = NEVER jog (wins over everything).
;   2. JogWeapons    - listed here = ALWAYS jog.
;   3. FireExtWeapons- listed here = fire-ext walkstyle (if the fix is on).
;   4. JogSlots      - FALLBACK: its weapon.dat slot is listed = jog.
; So the lists are your explicit control; the slot is the automatic default, which
; means a new add-on weapon in a jog slot (e.g. an SMG) jogs with no edits here.
;
; Weapon IDs in the lists below - a weapon matches on EITHER of these:
;   - The weapon TYPE id: for vanilla weapons, the numbers listed under
;     [JogWeapons]; for fastman92 add-on weapons, the type you set in
;     gtasa_weapon_config.dat.
;   - The MODEL id: from the .ide file that defines the weapon (add-on weapons).
; So an add-on weapon can be listed by its config weapon-type OR its model id.
; ===============================================================================

[JogWeapons]
; Weapon IDs to FORCE the one-handed jog on (even if their slot wouldn't).
; Comma- or space-separated; use the weapon TYPE (vanilla) or MODEL id (add-on).
;   2  Golf Club      8  Katana        10 Purple Dildo   12 Vibrator
;   14 Flowers        15 Cane          22 Pistol         23 Silenced Pistol
;   24 Desert Eagle   26 Sawn-off      28 Micro SMG      29 MP5
;   32 Tec-9          43 Camera
Weapons=2,8,10,12,14,15,22,23,24,26,28,29,32,43

[JogSlots]
; Fallback: any weapon whose weapon.dat slot (column I) is listed here jogs by
; default - so add-on weapons auto-jog by category without touching JogWeapons.
;   0 Unarmed   1 Melee     2 Handguns   3 Shotguns   4 SMGs    5 Assault
;   6 Rifles    7 Heavy     8 Thrown     9 Special    10 Gifts
; Default = handguns + SMGs:
Slots=2,4

[NoJogWeapons]
; Weapon IDs to FORCE off (never jog), even if their slot is in JogSlots above.
; Use for a weapon in a jog slot you don't want jogging. Empty by default.
Weapons=

[FireExtWeapons]
; Weapon IDs that use the fire-extinguisher / heavy one-handed walkstyle (groups 66/67/68).
; Only applied when FireExtinguisherWalkstyleFix=1.
;   42 Fire Extinguisher
Weapons=42

[AIWalkstyles]
; Ped-only lists for AIWeaponWalkstyles. Same ID rules as above - a weapon matches
; on its weapon TYPE (vanilla) or its MODEL id (add-on). Peds always use the plain
; group; the fat/muscular variants are CJ-only.

; Weapons carried with the rocket-launcher walkstyle (group 57 "playerrocket"):
;   35 Rocket Launcher   36 Heat-Seeking RPG
RocketWeapons=35,36

; Weapons carried two-handed like a rifle (group 60 "player2armed"):
;   25 Shotgun    27 Combat Shotgun   30 AK-47
;   31 M4         33 Country Rifle    34 Sniper Rifle
RifleWeapons=25,27,30,31,33,34

; Weapons carried in the one-handed/bat walkstyle (group 63 "playerBBBat") - the
; same group Stories Sprinting turns into the jog, so these peds jog too:
;   5 Baseball Bat   6 Shovel   7 Pool Cue
BatWeapons=5,6,7

; Weapons carried with the Chainsaw/Flamethrower walkstyle (group 66 "playercsaw"):
;   9 Chainsaw   37 Flamethrower   38 Minigun
HeavyWeapons=9,37,38

; Fallback: any weapon whose weapon.dat slot is listed here gets the rifle walkstyle,
; so add-on long guns are handled without listing them above. Checked after all the
; lists, so an explicit entry always wins. Default = shotguns + assault + rifles:
;   0 Unarmed   1 Melee     2 Handguns   3 Shotguns   4 SMGs    5 Assault
;   6 Rifles    7 Heavy     8 Thrown     9 Special    10 Gifts
; (Slot 7 "Heavy" is deliberately not listed - it mixes rocket and flamethrower
; walkstyles, so those weapons are better listed by ID above.)
RifleSlots=3,5,6
